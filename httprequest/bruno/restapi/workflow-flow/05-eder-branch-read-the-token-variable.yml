info:
  name: "5) eder branch: read the token variable (status/input)"
  type: http
  seq: 5

http:
  method: GET
  url: "{{host}}/engine-rest/process-instance/{{processInstanceId}}/variables/tokenVariable"
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=workflow-cib7-hello-world
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const token = res.body.value;
        console.log("eder token status: " + (token ? token.status : "missing") + ", input: " + (token ? token.input.inputVariable : "missing"));
        test("eder token variable is readable", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
            expect(!!token, "token value missing").to.be.true;
            expect(["STARTED", "RUNNING", "COMPLETED", "FINISHED", "BUSINESS_EXCEPTION"].indexOf(token.status) >= 0, "unexpected token status " + token.status).to.be.true;
            expect(token.input.inputVariable === "eder", "unexpected token input").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

