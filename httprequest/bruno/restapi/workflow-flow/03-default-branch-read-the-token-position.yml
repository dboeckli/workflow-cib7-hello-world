http:
  method: GET
  url: "{{host}}/engine-rest/process-instance/{{processInstanceId}}/activity-instances"
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=workflow-cib7-hello-world
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const root = res.body;
        const current = (root.childActivityInstances && root.childActivityInstances[0]) || (root.childTransitionInstances && root.childTransitionInstances[0]);
        console.log("default token position: " + (current ? current.activityId : "unknown"));
        test("default token is in the process", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
            expect(!!current, "no current activity or transition").to.be.true;
            expect(current.processInstanceId === bru.getVar("processInstanceId"), "processInstanceId mismatch").to.be.true;
        });

