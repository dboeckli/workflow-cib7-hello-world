info:
  name: 1) ping (application build info)
  type: http
  seq: 1

http:
  method: GET
  url: http://{{host}}/{{context}}/restapi/ping
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=workflow-cib7-hello-world
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("ping returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("ping returns build information", function () {
            expect(!!res.body.mavenGroupdId, "mavenGroupdId missing").to.be.true;
            expect(!!res.body.mavenArtifactId, "mavenArtifactId missing").to.be.true;
            expect(!!res.body.version, "version missing").to.be.true;
            expect(!!res.body.mavenTimeStamp, "mavenTimeStamp missing").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

