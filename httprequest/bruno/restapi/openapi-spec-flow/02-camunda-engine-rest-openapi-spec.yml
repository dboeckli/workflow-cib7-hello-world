runtime:
  scripts:
    - type: tests
      code: |-
        test("camunda spec returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("camunda spec contains the engine paths", function () {
            expect(!!res.body.openapi, "openapi version missing").to.be.true;
            expect(!!res.body.paths["/version"], "/version missing").to.be.true;
            expect(Object.keys(res.body.paths).length > 100, "unexpectedly few engine paths").to.be.true;
        });

