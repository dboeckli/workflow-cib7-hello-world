http:
  method: GET
  url: "{{host}}/swagger/v3/api-docs/restapi"
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=workflow-cib7-hello-world
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("restapi spec returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("restapi spec contains the REST API paths", function () {
            expect(!!res.body.openapi, "openapi version missing").to.be.true;
            expect(!!res.body.paths["/restapi/ping"], "/restapi/ping missing").to.be.true;
            expect(!!res.body.paths["/restapi/camunda"], "/restapi/camunda missing").to.be.true;
            expect(!!res.body.paths["/restapi/workflow"], "/restapi/workflow missing").to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

