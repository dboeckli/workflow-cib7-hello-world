apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "workflow-cib7-hello-world-ldap.fullname" . }}-test"
  namespace: {{ .Values.global.namespace }}
  # Do not use workflow-cib7-hello-world-ldap.labels here: its selector labels
  # would make this test pod a Service endpoint, so requests could hit the test
  # pod (nothing listening on the service port) instead of the application.
  labels:
    helm.sh/chart: {{ include "workflow-cib7-hello-world-ldap.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-ldap
      image: {{ .Values.alpineImage.repository }}:{{ .Values.alpineImage.tag }}
      imagePullPolicy: {{ .Values.alpineImage.pullPolicy }}
      command: [ '/bin/sh', '-c' ]
      args:
        - |
          # Install LDAP client tools
          apk add --no-cache openldap-clients

          echo "### Test: LDAP Connection and Search using service short name: {{ include "workflow-cib7-hello-world-ldap.fullname" . }}"
          ldapsearch -x -H ldap://{{ include "workflow-cib7-hello-world-ldap.fullname" . }}:{{ .Values.service.port }} \
                     -b {{ .Values.ldap.baseDN }} \
                     -D "{{ .Values.ldap.adminUsername }}" \
                     -w "{{ .Values.ldap.adminPassword }}" \
                     "(objectclass=*)"
          echo "Exit code: $?"
  restartPolicy: Never
