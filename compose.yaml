services:
  ldap:
    # vegardit/openldap is the maintained successor to the frozen bitnamilegacy/openldap
    # (see https://github.com/bitnami/containers/issues/83267)
    image: vegardit/openldap:2.6.10
    container_name: ldap
    environment:
      LDAP_INIT_ORG_DN: dc=example,dc=ch
      LDAP_INIT_ORG_NAME: Example, Inc
      # cn=admin,dc=example,dc=ch
      LDAP_INIT_ROOT_USER_DN: cn=admin,dc=example,dc=ch
      LDAP_INIT_ROOT_USER_PW: password
    ports:
      - 389:389
      #- 636:636
    healthcheck:
      test: [ "CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-D", "cn=admin,dc=example,dc=ch", "-w", "password", "-b", "dc=example,dc=ch" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - './ldifs/init_org_tree.ldif:/opt/ldifs/init_org_tree.ldif:ro'
      - './ldifs/init_org_entries.ldif:/opt/ldifs/init_org_entries.ldif:ro'
      - './ldifs/init_mdb_acls.ldif:/opt/ldifs/init_mdb_acls.ldif:ro'

  # web UI to browse the LDAP directory (dev only), see https://github.com/dnknth/ldap-ui
  ldap-ui:
    image: dnknth/ldap-ui:0.15.4
    container_name: ldap-ui
    environment:
      LDAP_URL: ldap://ldap:389/
      BASE_DN: dc=example,dc=ch
    ports:
      - "5000:5000"
    # override the image healthcheck: /api/health reads the base DN anonymously,
    # which depends on the LDAP ACL state; check the HTTP endpoint instead
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ldap:
        condition: service_healthy

  apifirst-server-jpa:
    container_name: apifirst-server-jpa
    image: domboeckli/apifirst-server-jpa:0.0.1-snapshot
    pull_policy: always
    environment:
      SERVER_PORT: 8082
      LOGGING_CONFIG: classpath:logback-kube.xml
    ports:
      - "8082:8082"
    expose:
      - 8082

  busybox:
    image: busybox:1.38.0
    container_name: busybox
    depends_on:
      apifirst-server-jpa:
        condition: service_started
        required: true
    healthcheck:
      test: [ "CMD", "sh", "-c", "
            echo 'Checking BusyBox readiness...' &&
            test -f /bin/sh &&
            wget -qO- http://apifirst-server-jpa:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"'
          " ]
      interval: 10s
      timeout: 10s
      retries: 10
    command: >
      /bin/sh -c '
      while true; do
        apifirst_server_jpa_health=$$(wget -q -O - http://apifirst-server-jpa:8082/actuator/health/readiness 2>/dev/null)
        echo "{
          \"timestamp\": \"$$(date -Iseconds)\",
          \"services\": {
            \"apifirst-server-jpa\": $$apifirst_server_jpa_health
          }
        }"

        sleep 30
      done
      '
